name: Dependabot auto-merge

# Turns on auto-merge (squash) for Dependabot's pull requests that are a patch update, or a minor
# update of a package at 1.0 or later; before 1.0 a minor version may break the API. Majors, and
# every update of a GitHub Action, wait for review. GitHub merges only once the checks required
# on main pass: the repository has "Allow auto-merge" on and a ruleset requiring the CI job
# `test` on main.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    # Opened and last pushed by Dependabot, not a branch someone else pushed to.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      # Pinned to a commit, not a tag: this job holds a token that can write to the repository,
      # and a tag can be moved to other code. Dependabot updates the hash and the comment.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        # Updates of GitHub Actions always wait for review: they change the code this job runs.
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !startsWith(steps.meta.outputs.previous-version, '0.')))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

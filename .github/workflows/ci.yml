name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      # Node 24 majors (checkout v5+, cache v5+); Node 20 actions are deprecated on runners.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, so mutation testing can tell what changed since the base below.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      # Includes Dialyzer, so a commit gated on `mix ci` locally is checked the same way.
      # Sources marked only_when_changed in test/mutate.exs are mutated when they changed since
      # the commit before the push (or the pull request's base); unknown means all of them.
      - run: mix ci
        env:
          XEITO_MUTATE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}

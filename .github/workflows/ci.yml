name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mutation testing of every source, nightly; pushes to main skip it, since the pre-push hook ran
  # it on the changed sources (see the mix ci step).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer run of the same kind on the same branch replaces one still running. Grouped by event,
# so a push never cancels the nightly run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      # Node 24 majors (checkout v5+, cache v5+); Node 20 actions are deprecated on runners.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, so mutation testing can tell what changed since the base below.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      # Includes Dialyzer, so a commit gated on `mix ci` locally is checked the same way.
      # Mutation testing: off for pushes to main (the pre-push hook, scripts/check-mutants.sh, ran
      # it on the sources changed since the pushed base; nightly here over every source), and for
      # pull requests on the sources that changed since their base (XEITO_MUTATE unset:
      # only_when_changed in test/mutate.exs); unknown means all of them.
      - run: mix ci
        env:
          XEITO_MUTATE: ${{ github.event_name == 'push' && 'off' || github.event_name == 'schedule' && 'all' || '' }}
          XEITO_MUTATE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
      # The plan against the repository (docs/plan-review.md §0): a nightly report that never
      # fails the job; the step shows as failed when there are findings.
      - if: github.event_name == 'schedule'
        continue-on-error: true
        run: mix xeito.plan.check

name: CodeQL

# Code scanning of the GitHub Actions workflows: script injection from pull request fields,
# permissions wider than a job needs, untrusted code run with a write token. CodeQL has no Elixir
# support, so the application code is not scanned here. Weekly as well, for new queries.

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      # Pinned to commits, not tags: this job can write code-scanning results, and a tag can be
      # moved to other code. Dependabot updates the hashes and the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
